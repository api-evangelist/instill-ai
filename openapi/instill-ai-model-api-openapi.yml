openapi: 3.2.0
info:
  title: Instill Core Model API
  description: Interact with Instill Core through API
  version: v0.57.0
  contact:
    name: Instill AI
    url: https://github.com/instill-ai
    email: support@instill-ai.com
  license:
    name: MIT
    url: https://github.com/instill-ai/protobufs/blob/main/LICENSE
servers:
- url: https://api.instill-ai.com
- url: http://api.instill-ai.com
security:
- Bearer: []
tags:
- name: Model
  description: AI Model orchestration
paths:
  /v1alpha/{name_3}:
    delete:
      summary: Delete a model
      description: 'Deletes a model, accesing it by its resource name, which is defined by the

        parent namespace and the ID of the model.'
      operationId: ModelPublicService_DeleteModel
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteModelResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_3
        description: 'The resource name of the model to delete.

          Format: `namespaces/{namespace}/models/{model}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+
      tags:
      - Model
      x-stage: alpha
  /v1alpha/model-definitions:
    get:
      summary: List model definitions
      description: Returns a paginated list of model definitions.
      operationId: ModelPublicService_ListModelDefinitions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelDefinitionsResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: pageSize
        description: 'The maximum number of model definitions to return. If this parameter

          is unspecified, at most 10 definitions will be returned. The cap value for

          this parameter is 100 (i.e. any value above that will be coerced to 100).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: Page token.
        in: query
        required: false
        schema:
          type: string
      - name: view
        description: "View allows clients to specify the desired resource view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information (omits `model_spec`).\n - VIEW_FULL: Full representation."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
      tags:
      - Model
      x-stage: alpha
  /v1alpha/available-regions:
    get:
      summary: List available regions
      description: Returns a paginated list of available regions.
      operationId: ModelPublicService_ListAvailableRegions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAvailableRegionsResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      tags:
      - Model
      x-stage: alpha
  /v1alpha/model-definitions/{modelDefinitionId}:
    get:
      summary: Get a model definition
      description: Returns the details of a model definition.
      operationId: ModelPublicService_GetModelDefinition
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelDefinitionResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: modelDefinitionId
        description: 'The resource name of the model definition, which allows its access by ID.

          - Format: `model-definitions/{id}`.'
        in: path
        required: true
        schema:
          type: string
      - name: view
        description: "View allows clients to specify the desired resource view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information (omits `model_spec`).\n - VIEW_FULL: Full representation."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
      tags:
      - Model
      x-stage: alpha
  /v1alpha/models:
    get:
      summary: List public models
      description: Returns a paginated list of public models.
      operationId: ModelPublicService_ListPublicModels
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPublicModelsResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: pageSize
        description: 'The maximum number of models to return. If this parameter is unspecified,

          at most 10 models will be returned. The cap value for this parameter is

          100 (i.e. any value above that will be coerced to 100).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: Page token.
        in: query
        required: false
        schema:
          type: string
      - name: view
        description: "View allows clients to specify the desired model view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information (omits `model_spec`).\n - VIEW_FULL: Full representation."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
      - name: showDeleted
        description: Include soft-deleted models in the result.
        in: query
        required: false
        schema:
          type: boolean
      - name: filter
        description: 'Filter can hold an [AIP-160](https://google.aip.dev/160)-compliant filter

          expression.

          - Example: `create_time>timestamp("2000-06-19T23:31:08.657Z")`.'
        in: query
        required: false
        schema:
          type: string
      - name: visibility
        description: "Limit results to pipelines with the specified visibility.\n\n - VISIBILITY_PRIVATE: Only the owner can see the model.\n - VISIBILITY_PUBLIC: Other users can see the model."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VISIBILITY_PRIVATE
          - VISIBILITY_PUBLIC
      - name: orderBy
        description: 'Order by field, with options for ordering by `id`, `create_time` or

          `update_time`. Format: `order_by=id` or `order_by=create_time desc`,

          default is `asc`.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Model
      x-stage: alpha
  /v1alpha/{parent}/models:
    get:
      summary: List models
      description: Returns a paginated list of models.
      operationId: ModelPublicService_ListModels
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name.

          Format: `namespaces/{namespace}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+
      - name: pageSize
        description: 'The maximum number of models to return. If this parameter is unspecified,

          at most 10 models will be returned. The cap value for this parameter is

          100 (i.e. any value above that will be coerced to 100).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: Page token.
        in: query
        required: false
        schema:
          type: string
      - name: view
        description: "View allows clients to specify the desired model view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information (omits `model_spec`).\n - VIEW_FULL: Full representation."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
      - name: showDeleted
        description: Include soft-deleted models in the result.
        in: query
        required: false
        schema:
          type: boolean
      - name: filter
        description: 'Filter can hold an [AIP-160](https://google.aip.dev/160)-compliant filter

          expression.

          - Example: `create_time>timestamp("2000-06-19T23:31:08.657Z")`.'
        in: query
        required: false
        schema:
          type: string
      - name: visibility
        description: "Limit results to pipelines with the specified visibility.\n\n - VISIBILITY_PRIVATE: Only the owner can see the model.\n - VISIBILITY_PUBLIC: Other users can see the model."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VISIBILITY_PRIVATE
          - VISIBILITY_PUBLIC
      - name: orderBy
        description: 'Order by field, with options for ordering by `id`, `create_time` or

          `update_time`. Format: `order_by=id` or `order_by=create_time desc`,

          default is `asc`.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Model
      x-stage: alpha
    post:
      summary: Create a new model
      description: 'Creates a new model under the parenthood of a namespace. This is an

        asynchronous endpoint, i.e., the server will not wait for the model to be

        created in order to respond. Instead, it will return a response with the

        necessary information to access the result and status of the creation

        operation.'
      operationId: ModelPublicService_CreateModel
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateModelResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name.

          Format: `namespaces/{namespace}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+
      tags:
      - Model
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model'
        description: The properties of the model to be created.
        required: true
  /v1alpha/{name_4}:
    get:
      summary: Get a model
      description: 'Returns the detail of a model, accessing it by the model ID and its parent

        namespace.'
      operationId: ModelPublicService_GetModel
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_4
        description: 'The resource name of the model.

          Format: `namespaces/{namespace}/models/{model}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+
      - name: view
        description: "View allows clients to specify the desired model view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information (omits `model_spec`).\n - VIEW_FULL: Full representation."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
      tags:
      - Model
      x-stage: alpha
    delete:
      summary: Delete a model version
      description: 'Deletes a model version, accesing it by its resource name, which is defined

        by the parent namespace and the ID of the model, and version.'
      operationId: ModelPublicService_DeleteModelVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteModelVersionResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_4
        description: 'The resource name of the model version to delete.

          Format: `namespaces/{namespace}/models/{model}/versions/{version}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+/versions/[^/]+
      tags:
      - Model
      x-stage: alpha
  /v1alpha/{model.name}:
    patch:
      summary: Update a model
      description: 'Updates a model, accessing it by its resource name, which is defined by

        the parent namespace and the ID of the model.


        In REST requests, only the supplied model fields will be taken into

        account when updating the resource.'
      operationId: ModelPublicService_UpdateModel
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateModelResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: model.name
        description: 'Field 1: Canonical resource name.

          Format: `namespaces/{namespace}/models/{model}`.'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+
      tags:
      - Model
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  title: 'Field 2: Immutable canonical resource ID (80-96 bits entropy, base62).

                    Example: "mod-8f3a2k9E7c1"'
                  readOnly: true
                displayName:
                  type: string
                  description: 'Field 3: Human-readable display name for UI.'
                slug:
                  type: string
                  description: 'Field 4: URL-friendly slug (NO prefix).

                    If omitted, server generates from display_name.

                    Slug is NOT part of resource identity.'
                aliases:
                  type: array
                  items:
                    type: string
                  description: 'Field 5: Previous slugs for backward compatibility.'
                  readOnly: true
                description:
                  type: string
                  description: 'Field 6: Optional description.'
                createTime:
                  type: string
                  format: date-time
                  description: 'Field 7: Creation time.'
                  readOnly: true
                updateTime:
                  type: string
                  format: date-time
                  description: 'Field 8: Last update time.'
                  readOnly: true
                modelDefinition:
                  type: string
                  description: The model definition that has been used to import the model.
                configuration:
                  type: object
                  description: 'Model configuration. This field is validated against the model

                    specification in the model definition.'
                task:
                  description: Model task.
                  allOf:
                  - $ref: '#/components/schemas/Task'
                visibility:
                  description: Model visibility.
                  allOf:
                  - $ref: '#/components/schemas/Model.Visibility'
                permission:
                  description: Permission defines how the model can be used.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/v1alpha.Permission'
                region:
                  type: string
                  description: Region of choice for the particular provider to host the model.
                hardware:
                  type: string
                  description: Hardware of choice to serve the model.
                inputSchema:
                  type: object
                  description: Input schema for the model.
                  readOnly: true
                outputSchema:
                  type: object
                  description: Output schema for the model.
                  readOnly: true
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags.
                versions:
                  type: array
                  items:
                    type: string
                  description: Version names.
                  readOnly: true
                stats:
                  description: Statistic data.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/Model.Stats'
                readme:
                  type: string
                  description: README holds the model documentation.
                sourceUrl:
                  type: string
                  description: A link to the source code of the model (e.g. to a GitHub repository).
                documentationUrl:
                  type: string
                  description: A link to any extra information.
                license:
                  type: string
                  description: License under which the model is distributed.
                profileImage:
                  type: string
                  description: Model profile image in base64 format.
                ownerName:
                  type: string
                  description: Resource name of the owner namespace.
                  readOnly: true
                owner:
                  description: Model owner (User or Organization).
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/Owner'
                creatorName:
                  type: string
                  title: 'Full resource name of the user who created this model.

                    Format: `users/{user}`'
                  readOnly: true
                creator:
                  description: The user who created this model.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/v1beta.User'
                deleteTime:
                  type: string
                  format: date-time
                  description: Soft delete timestamp.
                  readOnly: true
              title: 'The model resource to update. The model''s `name` field identifies

                the resource. Format: `namespaces/{namespace}/models/{model}`'
              required:
              - displayName
              - modelDefinition
              - configuration
              - task
              - visibility
              - region
              - hardware
        description: 'The model resource to update. The model''s `name` field identifies

          the resource. Format: `namespaces/{namespace}/models/{model}`'
        required: true
  /v1alpha/{name}/rename:
    post:
      summary: Rename a model
      description: 'Renames a model, accesing it by its resource name, which is defined by the

        parent namespace and the ID of the model.'
      operationId: ModelPublicService_RenameModel
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameModelResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the model to rename.

          Format: namespaces/{namespace}/models/{model}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+
      tags:
      - Model
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameModelBody'
        required: true
  /v1alpha/{name}/versions/{version}/watch:
    get:
      summary: Watch the state of a model version
      description: 'Returns the state of a model. The model resource allocation and scaling

        actions take some time, during which a model will be in various state. This

        endpoint allows clients to track the state.'
      operationId: ModelPublicService_WatchModelVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchModelVersionResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the model to watch.

          Format: namespaces/{namespace}/models/{model}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+
      - name: version
        description: Model version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Model
      x-stage: alpha
  /v1alpha/{name}/watch:
    get:
      summary: Watch the state of the latest model version
      description: 'Returns the state of the latest model version. The model resource

        allocation and scaling actions take some time, during which a model will be

        in various state. This endpoint allows clients to track the state.'
      operationId: ModelPublicService_WatchModel
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchModelResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the model to watch.

          Format: namespaces/{namespace}/models/{model}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+
      tags:
      - Model
      x-stage: alpha
  /v1alpha/{parent}/versions:
    get:
      summary: List namespace model versions
      description: 'Returns a paginated list of version of a model namespace that belong to the

        specified namespace. Contains model version and digest.'
      operationId: ModelPublicService_ListModelVersions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelVersionsResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name (model).

          Format: `namespaces/{namespace}/models/{model}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+
      - name: pageSize
        description: 'The maximum number of versions to return. The default and cap values are 10

          and 100, respectively.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        description: Page number.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Model
      x-stage: alpha
  /v1alpha/{name}/trigger:
    post:
      summary: Trigger model inference
      description: 'Triggers a deployed model to infer the result of a set of task or

        questions.'
      operationId: ModelPublicService_TriggerModelVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerModelVersionResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the model version to trigger.

          Format: `namespaces/{namespace}/models/{model}/versions/{version}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+/versions/[^/]+
      - name: Instill-Requester-Uid
        description: Indicates the authenticated namespace is making the request on behalf of another entity, typically an organization they belong to
        in: header
        required: false
        schema:
          type: string
      tags:
      - Model
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerModelVersionBody'
        required: true
  /v1alpha/{name}/trigger-async:
    post:
      summary: Trigger model inference asynchronously
      description: 'Triggers a deployed model to infer the result of a set of task or

        questions.'
      operationId: ModelPublicService_TriggerAsyncModelVersion
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerAsyncModelVersionResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the model version to trigger.

          Format: `namespaces/{namespace}/models/{model}/versions/{version}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/models/[^/]+/versions/[^/]+
      - name: Instill-Requester-Uid
