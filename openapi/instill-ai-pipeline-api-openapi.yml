openapi: 3.2.0
info:
  title: Instill Ai Pipeline API
  version: v0.57.0
  contact:
    name: Instill AI
    url: https://github.com/instill-ai
    email: support@instill-ai.com
  license:
    name: MIT
    url: https://github.com/instill-ai/protobufs/blob/main/LICENSE
  description: 'Operations tagged Pipeline across 2 of this provider''s published API definitions: service.swagger.yaml, instill-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instill-ai.com
- url: http://api.instill-ai.com
security:
- Bearer: []
tags:
- name: Pipeline
  description: Pipeline orchestration.
paths:
  /v1beta/{name_2}:
    delete:
      summary: Delete a pipeline
      description: 'Deletes a pipeline, accesing it by its resource name, which is defined by

        the parent namespace and the ID of the pipeline. The authenticated

        namespace must be the parent of the pipeline in order to delete it.'
      operationId: PipelinePublicService_DeletePipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_2
        description: 'The resource name of the pipeline to delete.

          Format: `namespaces/{namespace}/pipelines/{pipeline}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      tags:
      - Pipeline
      x-stage: beta
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/pipelines:
    get:
      summary: List accessible pipelines
      description: Returns a paginated list of pipelines that are visible to the requester.
      operationId: PipelinePublicService_ListPublicPipelines
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPublicPipelinesResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: pageSize
        description: 'The maximum number of pipelines to return. If this parameter is

          unspecified, at most 10 pipelines will be returned. The cap value for this

          parameter is 100 (i.e. any value above that will be coerced to 100).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: Page token.
        in: query
        required: false
        schema:
          type: string
      - name: view
        description: "View allows clients to specify the desired pipeline view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information.\n - VIEW_FULL: Full representation.\n - VIEW_RECIPE: Contains the recipe of the resource."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
          - VIEW_RECIPE
      - name: filter
        description: 'Filter can hold an [AIP-160](https://google.aip.dev/160)-compliant filter

          expression.

          - Example: `create_time>timestamp("2000-06-19T23:31:08.657Z")`.

          - Example:

          `recipe.components.definition_name:"operator-definitions/2ac8be70-0f7a-4b61-a33d-098b8acfa6f3"`.'
        in: query
        required: false
        schema:
          type: string
      - name: showDeleted
        description: Include soft-deleted pipelines in the result.
        in: query
        required: false
        schema:
          type: boolean
      - name: visibility
        description: "Limit results to pipelines with the specified visibility.\n\n - VISIBILITY_PRIVATE: Only the user can see the pipeline.\n - VISIBILITY_PUBLIC: Other users can see the pipeline."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VISIBILITY_PRIVATE
          - VISIBILITY_PUBLIC
      - name: orderBy
        description: 'Order by field, with options for ordering by `id`, `create_time` or

          `update_time`. Format: `order_by=id` or `order_by=create_time desc`,

          default is `asc`.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Pipeline
      x-stage: beta
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{parent}/pipelines:
    get:
      summary: List namespace pipelines
      description: Returns a paginated list of pipelines of a namespace
      operationId: PipelinePublicService_ListPipelines
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPipelinesResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name.

          Format: `namespaces/{namespace}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+
      - name: pageSize
        description: 'The maximum number of pipelines to return. If this parameter is

          unspecified, at most 10 pipelines will be returned. The cap value for this

          parameter is 100 (i.e. any value above that will be coerced to 100).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: Page token.
        in: query
        required: false
        schema:
          type: string
      - name: view
        description: "View allows clients to specify the desired pipeline view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information.\n - VIEW_FULL: Full representation.\n - VIEW_RECIPE: Contains the recipe of the resource."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
          - VIEW_RECIPE
      - name: filter
        description: 'Filter can hold an [AIP-160](https://google.aip.dev/160)-compliant filter

          expression.

          - Example: `create_time>timestamp("2000-06-19T23:31:08.657Z")`.

          - Example:

          `recipe.components.definition_name:"operator-definitions/2ac8be70-0f7a-4b61-a33d-098b8acfa6f3"`.'
        in: query
        required: false
        schema:
          type: string
      - name: showDeleted
        description: Include soft-deleted pipelines in the result.
        in: query
        required: false
        schema:
          type: boolean
      - name: visibility
        description: "Limit results to pipelines with the specified visibility.\n\n - VISIBILITY_PRIVATE: Only the user can see the pipeline.\n - VISIBILITY_PUBLIC: Other users can see the pipeline."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VISIBILITY_PRIVATE
          - VISIBILITY_PUBLIC
      - name: orderBy
        description: 'Order by field, with options for ordering by `id`, `create_time` or

          `update_time`. Format: `order_by=id` or `order_by=create_time desc`,

          default is `asc`.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Pipeline
      x-stage: beta
    post:
      summary: Create a new pipeline
      description: Creates a new pipeline under a namespace.
      operationId: PipelinePublicService_CreatePipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name.

          Format: `namespaces/{namespace}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+
      tags:
      - Pipeline
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pipeline'
        description: The properties of the pipeline to be created.
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{name_3}:
    get:
      summary: Get a pipeline
      description: Returns the details of a pipeline.
      operationId: PipelinePublicService_GetPipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_3
        description: 'The resource name of the pipeline.

          Format: `namespaces/{namespace}/pipelines/{pipeline}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      - name: view
        description: "View allows clients to specify the desired pipeline view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information.\n - VIEW_FULL: Full representation.\n - VIEW_RECIPE: Contains the recipe of the resource."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
          - VIEW_RECIPE
      tags:
      - Pipeline
      x-stage: beta
    delete:
      summary: Delete a pipeline release
      description: 'Deletes a pipeline release, where the pipeline is identified by its

        resource name, formed by its parent namespace and ID.


        The authenticated namespace must be the parent of the pipeline in order to

        perform this action.'
      operationId: PipelinePublicService_DeletePipelineRelease
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePipelineReleaseResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_3
        description: 'The resource name of the release to delete.

          Format: `namespaces/{namespace}/pipelines/{pipeline}/releases/{release}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+/releases/[^/]+
      tags:
      - Pipeline
      x-stage: beta
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{pipeline.name}:
    patch:
      summary: Update a pipeline
      description: 'Udpates a pipeline, accessing it by its resource name, which is defined by

        the parent namespace and the ID of the pipeline. The authenticated

        namespace must be the parent of the pipeline in order to modify it.


        In REST requests, only the supplied pipeline fields will be taken into

        account when updating the resource.'
      operationId: PipelinePublicService_UpdatePipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: pipeline.name
        description: 'Field 1: Canonical resource name.

          Format: `namespaces/{namespace}/pipelines/{pipeline}`.'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      tags:
      - Pipeline
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  title: 'Field 2: Immutable canonical resource ID (80-96 bits entropy, base62).

                    Example: "pip-8f3a2k9E7c1"'
                  readOnly: true
                displayName:
                  type: string
                  description: 'Field 3: Human-readable display name for UI.'
                slug:
                  type: string
                  description: 'Field 4: URL-friendly slug (NO prefix).

                    If omitted, server generates from display_name.

                    Slug is NOT part of resource identity.'
                aliases:
                  type: array
                  items:
                    type: string
                  description: 'Field 5: Previous slugs for backward compatibility.'
                  readOnly: true
                description:
                  type: string
                  description: 'Field 6: Optional description.'
                createTime:
                  type: string
                  format: date-time
                  description: 'Field 7: Creation time.'
                  readOnly: true
                updateTime:
                  type: string
                  format: date-time
                  description: 'Field 8: Last update time.'
                  readOnly: true
                recipe:
                  type: object
                  description: Recipe describes the components of a Pipeline and how they are connected.
                rawRecipe:
                  type: string
                  description: Recipe in YAML format.
                visibility:
                  description: Pipeline visibility.
                  allOf:
                  - $ref: '#/components/schemas/Pipeline.Visibility'
                sharing:
                  description: Pipeline sharing information.
                  allOf:
                  - $ref: '#/components/schemas/Sharing'
                permission:
                  description: Permission defines how a pipeline can be used.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/pipeline.v1beta.Permission'
                dataSpecification:
                  description: Data specifications.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/DataSpecification'
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags.
                stats:
                  description: Statistic data.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/Pipeline.Stats'
                metadata:
                  type: object
                  description: Metadata holds console-related data such as the pipeline builder layout.
                readme:
                  type: string
                  description: README holds the pipeline documentation.
                releases:
                  type: array
                  items:
                    type: object
                    $ref: '#/components/schemas/PipelineRelease'
                  description: Releases holds the history of pipeline versions.
                  readOnly: true
                endpoints:
                  description: Pipeline endpoints.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/Endpoints'
                sourceUrl:
                  type: string
                  description: A link to the source code of the pipeline (e.g. to a GitHub repository).
                documentationUrl:
                  type: string
                  description: A link to any extra information.
                license:
                  type: string
                  description: License under which the pipeline is distributed.
                profileImage:
                  type: string
                  description: Pipeline profile image in base64 format.
                ownerName:
                  type: string
                  description: Resource name of the owner namespace.
                  readOnly: true
                owner:
                  description: Pipeline owner (User or Organization).
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/Owner'
                creatorName:
                  type: string
                  title: 'Full resource name of the user who created this pipeline.

                    Format: `users/{user}`'
                  readOnly: true
                creator:
                  description: The user who created this pipeline.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/v1beta.User'
                deleteTime:
                  type: string
                  format: date-time
                  description: Soft delete timestamp.
                  readOnly: true
              title: 'The pipeline resource to update. The pipeline''s `name` field identifies

                the resource. Format: `namespaces/{namespace}/pipelines/{pipeline}`'
              required:
              - displayName
              - recipe
              - visibility
        description: 'The pipeline resource to update. The pipeline''s `name` field identifies

          the resource. Format: `namespaces/{namespace}/pipelines/{pipeline}`'
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{name}/validate:
    post:
      summary: Validate a pipeline
      description: 'Validates a pipeline by its resource name, which is defined by the parent

        namespace and the ID of the pipeline.


        Validation checks the recipe of the pipeline and the status of its

        components.'
      operationId: PipelinePublicService_ValidatePipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatePipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the pipeline to validate.

          Format: namespaces/{namespace}/pipelines/{pipeline}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      tags:
      - Pipeline
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePipelineBody'
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{name}/rename:
    post:
      summary: Rename a pipeline
      description: 'Updates the ID of a pipeline. Since this is an output-only field, a custom

        method is required to modify it.


        The pipeline name will be updated accordingly, as it is composed by the

        parent namespace and ID of the pipeline (e.g.

        `namespaces/luigi/pipelines/pizza-recipe-generator`).


        The authenticated namespace must be the parent of the pipeline in order to

        perform this action.'
      operationId: PipelinePublicService_RenamePipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenamePipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the pipeline to rename.

          Format: namespaces/{namespace}/pipelines/{pipeline}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      tags:
      - Pipeline
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenamePipelineBody'
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{name}/clone:
    post:
      summary: Clone a pipeline
      description: 'Clones a pipeline owned by a namespace. The new pipeline may have a

        different parent, and this can be either a namespace or an organization.'
      operationId: PipelinePublicService_ClonePipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClonePipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the source pipeline to clone.

          Format: namespaces/{namespace}/pipelines/{pipeline}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      tags:
      - Pipeline
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClonePipelineBody'
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{name}/trigger:
    post:
      summary: Trigger a pipeline
      description: 'Triggers the execution of a pipeline synchronously, i.e., the result is

        sent back to the namespace right after the data is processed. This method

        is intended for real-time inference when low latency is of concern.


        The pipeline is identified by its resource name, formed by the parent

        namespace and ID of the pipeline.


        For more information, see Run

        Pipeline.'
      operationId: PipelinePublicService_TriggerPipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerPipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the pipeline to trigger.

          Format: namespaces/{namespace}/pipelines/{pipeline}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      - name: Instill-Requester-Uid
        description: Indicates the authenticated namespace is making the request on behalf of another entity, typically an organization they belong to
        in: header
        required: false
        schema:
          type: string
      tags:
      - Pipeline
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerPipelineBody'
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{name}/trigger-stream:
    post:
      summary: Trigger a pipeline via streaming
      description: 'Triggers the execution of a pipeline asynchronously and streams back the

        response. This method is intended for real-time inference when low latency

        is of concern and the response needs to be processed incrementally.


        The pipeline is identified by its resource name, formed by the parent

        namespace and ID of the pipeline.'
      operationId: PipelinePublicService_TriggerPipelineWithStream
      responses:
        '200':
          description: A successful response.(streaming responses)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/TriggerPipelineWithStreamResponse'
                  error:
                    $ref: '#/components/schemas/rpc.Status'
                title: Stream result of TriggerPipelineWithStreamResponse
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the pipeline to trigger.

          Format: namespaces/{namespace}/pipelines/{pipeline}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      - name: Instill-Requester-Uid
        description: Indicates the authenticated namespace is making the request on behalf of another entity, typically an organization they belong to
        in: header
        required: false
        schema:
          type: string
      tags:
      - Pipeline
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerPipelineWithStreamBody'
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1beta/{name}/trigger-async:
    post:
      summary: Trigger a pipeline asynchronously
      description: 'Triggers the execution of a pipeline asynchronously, i.e., the result

        contains the necessary information to access the result and status of the

        operation. This method is intended for cases that require long-running

        workloads.


        The pipeline is identified by its resource name, formed by the parent

        namespace and ID of the pipeline.


        For more information, see Run

        Pipeline.'
      operationId: PipelinePublicService_TriggerAsyncPipeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerAsyncPipelineResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the pipeline to trigger.

          Format: namespaces/{namespace}/pipelines/{pipeline}'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/pipelines/[^/]+
      - name: Instill-Requester-Uid
        description: Indicates the authenticated namespace is making the request on behalf of another entity, typically an organization they belong to
        in: header
        required: false
        schema:
          type: string
      tags:
      - Pipeline
      x-stage: beta
      requestBody:
        content:
          application/json:
