      parameters:
      - name: name_2
        description: 'The resource name of the connection.

          Format: `namespaces/{namespace}/connections/{connection}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/connections/[^/]+
      - name: view
        description: "View allows clients to specify the desired view in the response.\n\n - VIEW_BASIC: Default view, only includes basic information.\n - VIEW_FULL: Full representation."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
      tags:
      - Connection
      x-stage: beta
  /v1beta/{connection.name}:
    patch:
      summary: Update a connection
      description: Updates a connection with the supplied connection fields.
      operationId: MgmtPublicService_UpdateNamespaceConnection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNamespaceConnectionResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: connection.name
        description: 'Field 1: Canonical resource name.

          Format: `namespaces/{namespace}/connections/{connection}`.'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/connections/[^/]+
      tags:
      - Connection
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  title: 'Field 2: Immutable canonical resource ID (80-96 bits entropy, base62).

                    Example: "con-8f3a2k9E7c1"'
                  readOnly: true
                displayName:
                  type: string
                  description: 'Field 3: Human-readable display name for UI.'
                slug:
                  type: string
                  title: 'Field 4: URL-friendly slug (NO prefix).

                    If omitted, server generates from display_name.

                    If provided, server validates and persists it.

                    Slug is NOT part of resource identity.

                    Example: "my-google-drive"'
                aliases:
                  type: array
                  items:
                    type: string
                  description: 'Field 5: Previous slugs for backward compatibility.

                    When display_name changes, a new slug is generated and old slugs are stored

                    here.'
                  readOnly: true
                description:
                  type: string
                  description: 'Field 6: Optional description.'
                createTime:
                  type: string
                  format: date-time
                  description: 'Field 7: Creation time.'
                  readOnly: true
                updateTime:
                  type: string
                  format: date-time
                  description: 'Field 8: Last update time.'
                  readOnly: true
                namespaceId:
                  type: string
                  description: 'Field 9: ID of the namespace owning the connection.'
                  readOnly: true
                integrationId:
                  type: string
                  description: 'Field 10: Integration ID. It determines for which type of components can

                    reference this connection.'
                integrationTitle:
                  type: string
                  description: 'Field 11: Integration title. This helps the console display the results

                    grouped by integration ID without needing an extra call to fetch title by

                    integration ID.'
                  readOnly: true
                method:
                  description: 'Field 12: Connection method. It references the setup schema provided by the

                    integration.'
                  allOf:
                  - $ref: '#/components/schemas/mgmt.v1beta.Connection.Method'
                setup:
                  type: object
                  description: 'Field 13: Connection details. This field is required on creation, optional

                    on view. When viewing the connection details, the setup values will be

                    redacted.'
                view:
                  title: 'Field 14: View defines how the connection is presented. The following

                    fields are only shown in the FULL view:

                    - setup

                    - scopes

                    - oAuthAccessDetails'
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/mgmt.v1beta.View'
                scopes:
                  type: array
                  items:
                    type: string
                  description: 'Field 15: A list of scopes that identify the resources that the connection

                    will be able to access on the user''s behalf. This is typically passed on

                    creation when the setup has been generated through an OAuth flow with a

                    limited set of scopes.'
                oAuthAccessDetails:
                  type: object
                  description: 'Field 16: When the connection method is METHOD_OAUTH, the access token

                    might come with some extra information that might vary across vendors. This

                    information is passed as connection metadata.'
                identity:
                  type: string
                  description: 'Field 17: When the connection method is METHOD_OAUTH, this field will hold

                    the identity (e.g., email, username) with which the access token has been

                    generated.'
              title: 'Connection object with the new properties to be updated. The connection''s

                `name` field identifies the resource.

                Format: `namespaces/{namespace}/connections/{connection}`

                Immutable and output-only fields will be ignored. The Setup property must

                be updated in block (no partial update is supported).'
              required:
              - displayName
              - integrationId
              - method
              - setup
        description: 'Connection object with the new properties to be updated. The connection''s

          `name` field identifies the resource.

          Format: `namespaces/{namespace}/connections/{connection}`

          Immutable and output-only fields will be ignored. The Setup property must

          be updated in block (no partial update is supported).'
        required: true
  /v1beta/{name}/test:
    post:
      summary: Test a connection
      description: 'Makes a request to the 3rd party app that the connection is configured to

        communicate with, and checks the result of the call. If the test fails,

        the response status and error message will provide more information about

        the failure.


        Note that this action might affect the quota or billing of the integrated

        account in the 3rd party app.'
      operationId: MgmtPublicService_TestNamespaceConnection
      responses:
        '200':
