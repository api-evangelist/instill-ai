openapi: 3.2.0
info:
  title: Instill Core Connection API
  description: Interact with Instill Core through API
  version: v0.57.0
  contact:
    name: Instill AI
    url: https://github.com/instill-ai
    email: support@instill-ai.com
  license:
    name: MIT
    url: https://github.com/instill-ai/protobufs/blob/main/LICENSE
servers:
- url: https://api.instill-ai.com
- url: http://api.instill-ai.com
security:
- Bearer: []
tags:
- name: Connection
  description: Connections to 3rd party apps for use in pipelines.
paths:
  /v1beta/{name_1}:
    delete:
      summary: Delete a connection
      description: Deletes a connection.
      operationId: MgmtPublicService_DeleteNamespaceConnection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteNamespaceConnectionResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_1
        description: 'The resource name of the connection to delete.

          Format: `namespaces/{namespace}/connections/{connection}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/connections/[^/]+
      tags:
      - Connection
      x-stage: beta
  /v1beta/{parent}/connections:
    get:
      summary: List namespace connections
      description: Returns a paginated list of connections created by a namespace.
      operationId: MgmtPublicService_ListNamespaceConnections
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNamespaceConnectionsResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name.

          Format: `namespaces/{namespace}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+
      - name: pageSize
        description: 'The maximum number of items to return. The default and cap values are 10

          and 100, respectively.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: Page token. By default, the first page will be returned.
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: 'Filter can hold an [AIP-160](https://google.aip.dev/160)-compliant filter

          expression. The following filters are supported:

          - `integrationId`

          - `qConnection` (fuzzy search on connection ID, integration title or

          vendor)


          **Examples**:

          - List connections where app name, vendor or connection ID match `googl`:

          `q="googl"`.

          - List connections where the component type is `openai` (e.g. to setup a

          connector within a pipeline): `integrationId="openai"`.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Connection
      x-stage: beta
    post:
      summary: Create a connection
      description: Creates a connection under the ownership of a namespace.
      operationId: MgmtPublicService_CreateNamespaceConnection
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNamespaceConnectionResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name.

          Format: `namespaces/{namespace}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+
      tags:
      - Connection
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mgmt.v1beta.Connection'
        description: Properties of the connection to be created.
        required: true
  /v1beta/{name_2}:
    get:
      summary: Get a namespace connection
      description: Returns the details of a connection.
      operationId: MgmtPublicService_GetNamespaceConnection
      responses:
