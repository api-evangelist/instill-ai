components:
  schemas:
    UpdateObjectBody:
      type: object
      properties:
        object:
          type: object
          properties:
            id:
              type: string
              description: 'Immutable canonical resource ID (e.g., "obj-3k7m9p2w5t1").

                Hash-based, unique within a namespace.'
              readOnly: true
            displayName:
              type: string
              description: Human-readable display name (user-provided filename).
            ownerName:
              type: string
              title: 'Resource name of the owner namespace.

                Format: `namespaces/{namespace}`'
              readOnly: true
            creatorName:
              type: string
              title: 'Full resource name of the user who created this object.

                Format: `users/{user}`'
              readOnly: true
            createTime:
              type: string
              format: date-time
              description: Object creation time.
              readOnly: true
            updateTime:
              type: string
              format: date-time
              description: Object update time.
              readOnly: true
            size:
              type: string
              format: int64
              description: Size in bytes.
              readOnly: true
            contentType:
              type: string
              description: Content type (MIME type from Content-Type header or file extension).
              readOnly: true
            isUploaded:
              type: boolean
              description: Whether the file has been uploaded to storage.
              readOnly: true
            objectExpireDays:
              type: integer
              format: int32
              description: 'Object expiration time in days.

                If set to 0, the object will not be deleted automatically.'
            lastModifiedTime:
              type: string
              format: date-time
              description: Last modified time (client-provided metadata).
            deleteTime:
              type: string
              format: date-time
              description: Object delete time (for soft delete). Output only.
              readOnly: true
            slug:
              type: string
              title: 'URL-friendly slug derived from display_name.

                Example: "my-document-pdf"'
            aliases:
              type: array
              items:
                type: string
              description: Previous slugs for backward compatibility when display_name changes.
              readOnly: true
          title: 'The object to update. The object''s `name` field identifies it.

            Format: `namespaces/{namespace}/objects/{object}`'
        updateMask:
          type: string
          description: The update mask specifies which fields to update.
      description: 'UpdateObjectRequest represents a request to update an object.

        Follows AIP-134: resource''s `name` field identifies it.'
      required:
      - object
    CreateFileResponse:
      type: object
      properties:
        file:
          title: file
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/File'
      description: CreateFileResponse represents a response for creating a file.
    ListChunksResponse:
      type: object
      properties:
        chunks:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Chunk'
          title: repeated chunks
          readOnly: true
      description: 'ListChunksResponse represents a response containing a list of chunks in the

        artifact system.'
    rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: 'The status code, which should be an enum value of

            [google.rpc.Code][google.rpc.Code].'
        message:
          type: string
          description: 'A developer-facing error message, which should be in English. Any

            user-facing error message should be localized and sent in the

            [google.rpc.Status.details][google.rpc.Status.details] field, or localized

            by the client.'
        details:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Any'
          description: 'A list of messages that carry the error details.  There is a common set of

            message types for APIs to use.'
      description: 'The `Status` type defines a logical error model that is suitable for

        different programming environments, including REST APIs and RPC APIs. It is

        used by [gRPC](https://github.com/grpc). Each `Status` message contains

        three pieces of data: error code, error message, and error details.


        You can find out more about this error model and how to work with it in the

        [API Design Guide](https://cloud.google.com/apis/design/errors).'
    ReprocessFileBody:
      type: object
      description: ReprocessFileRequest represents a request to reprocess a file.
    GetObjectUploadURLResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          title: upload url
        urlExpireAt:
          type: string
          format: date-time
          title: expire at in UTC (UTC+0)
        object:
          title: object
          allOf:
          - $ref: '#/components/schemas/Object'
      title: GetObjectUploadURLResponse
    File.Visibility:
      type: string
      enum:
      - VISIBILITY_PRIVATE
      - VISIBILITY_PUBLIC
      - VISIBILITY_WORKSPACE
      - VISIBILITY_LINK_SHARED
      description: "Visibility defines who can discover and access the file.\n\n - VISIBILITY_PRIVATE: Reserved for future: truly private (only creator + invited users).\n - VISIBILITY_PUBLIC: Discoverable by anyone, including anonymous visitors.\n - VISIBILITY_WORKSPACE: Org members can access via all-members grant. Default for files.\n - VISIBILITY_LINK_SHARED: Anyone with the share link (/r/{token}) can access via capability token."
    SearchChunksBody:
      type: object
      properties:
        knowledgeBase:
          type: string
          title: 'The knowledge base resource name to filter by (optional).

            Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`'
        textPrompt:
          type: string
          description: Text prompt to look for similarities.
        topK:
          type: integer
          format: int64
          description: 'Top K. Default value: 5.'
        type:
          description: Chunk type.
          allOf:
          - $ref: '#/components/schemas/Chunk.Type'
        fileMediaType:
          description: File media type.
          allOf:
          - $ref: '#/components/schemas/FileMediaType'
        files:
          type: array
          items:
            type: string
          title: 'File resource names to filter by. When this field is provided, the response

            will return only chunks that belong to the specified files.

            Format:

            `namespaces/{namespace}/knowledge-bases/{knowledge_base}/files/{file}`'
        tags:
          type: array
          items:
            type: string
          description: 'Tags to filter by. When multiple tags are provided, OR logic is applied.

            Note: File filter takes precedence over tags, as tags apply to files.'
        groupByFile:
          type: boolean
          description: 'When true, results are grouped by file so that no single file dominates

            the result set. At most group_size chunks are returned per file.'
        groupSize:
          type: integer
          format: int32
          description: 'Max chunks per file when group_by_file is true. Default: 1.'
      description: SearchChunksRequest represents a request to search for similar chunks.
      required:
      - textPrompt
    GetObjectResponse:
      type: object
      properties:
        object:
          description: The requested object.
          allOf:
          - $ref: '#/components/schemas/Object'
      description: GetObjectResponse contains the requested object.
    Unit:
      type: string
      enum:
      - UNIT_CHARACTER
      - UNIT_PAGE
      - UNIT_TIME_MS
      - UNIT_PIXEL
      description: "Unit of measurement for a position within a file.\n\n - UNIT_CHARACTER: Character positions (for Markdown and other text files).\n - UNIT_PAGE: Page positions (for documents). For pages, positions are 1-indexed\n(e.g., page 4 of 4) to align with document visualization standards.\n - UNIT_TIME_MS: Time positions in milliseconds (for audio/video files).\n - UNIT_PIXEL: Pixel positions (for images and other 2D content)."
    ReprocessFileResponse:
      type: object
      properties:
        file:
          description: The file being reprocessed.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/File'
        message:
          type: string
          description: Status message.
          readOnly: true
      description: ReprocessFileResponse represents a response for reprocessing a file.
    Owner:
      type: object
      properties:
        user:
          description: User.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/v1beta.User'
        organization:
          description: Organization.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Organization'
      description: 'Owner is a wrapper for User and Organization, used to embed owner information

        in other resources.'
    v1beta.User:
      type: object
      properties:
        name:
          type: string
          title: 'Field 1: Canonical resource name.

            Format: `users/{user}`.

            Example: "users/john-doe"'
          readOnly: true
        id:
          type: string
          title: 'Field 2: Resource ID (used in `name` as the last segment). This conforms to

            RFC-1034, which restricts to letters, numbers, and hyphen, with the first

            character a letter, the last a letter or a number, and a 63 character

            maximum.

            Auto-generated by backend: "usr-" prefix + immutable hash (80 bits entropy,

            base62). Example: "usr-8f3A2k9E7c1xYz"'
