          readOnly: true
        size:
          type: string
          format: int64
          description: File size in bytes.
          readOnly: true
        totalChunks:
          type: integer
          format: int32
          description: Total number of chunks created from this file.
          readOnly: true
        totalTokens:
          type: integer
          format: int32
          description: Total number of tokens in this file.
          readOnly: true
        tags:
