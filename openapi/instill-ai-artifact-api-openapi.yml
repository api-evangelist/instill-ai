openapi: 3.2.0
info:
  title: Instill Ai Artifact API
  version: v0.57.0
  contact:
    name: Instill AI
    url: https://github.com/instill-ai
    email: support@instill-ai.com
  license:
    name: MIT
    url: https://github.com/instill-ai/protobufs/blob/main/LICENSE
  description: 'Operations tagged Artifact across 2 of this provider''s published API definitions: service.swagger.yaml, instill-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.instill-ai.com
- url: http://api.instill-ai.com
security:
- Bearer: []
tags:
- name: Artifact
  description: Data orchestration for unified unstructured data representation.
paths:
  /v1alpha/{parent}/knowledge-bases:
    get:
      summary: Get all knowledge bases info
      description: Returns a paginated list of knowledge bases.
      operationId: ArtifactPublicService_ListKnowledgeBases
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListKnowledgeBasesResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name.

          Format: `namespaces/{namespace}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+
      - name: pageSize
        description: 'The maximum number of knowledge bases to return. If this parameter is

          unspecified, at most 10 knowledge bases will be returned. The cap value for

          this parameter is 100 (i.e. any value above that will be coerced to 100).'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: Page token for pagination.
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: 'Filter can hold an [AIP-160](https://google.aip.dev/160)-compliant filter

          expression.

          - `id="<knowledge_base_id>"` or `uid="<uuid>"` - Filter by specific

          knowledge base ID/UID

          - `q="<text>"` - Fuzzy search on knowledge base ID and description


          **Examples**:

          - Filter by ID: `id="my-knowledge-base"`

          - Search knowledge bases: `q="my-knowledge-base"`'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Artifact
      x-stage: alpha
    post:
      summary: Create a knowledge base
      description: Creates a knowledge base.
      operationId: ArtifactPublicService_CreateKnowledgeBase
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKnowledgeBaseResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name.

          Format: `namespaces/{namespace}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+
      tags:
      - Artifact
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBase'
        description: "The knowledge base resource to create.\nRequired fields: display_name\nOptional fields: id (auto-generated from display_name if not provided),\n                 description, tags, type, system_id"
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1alpha/{name}:
    get:
      summary: Get a knowledge base
      description: Returns the details of a knowledge base.
      operationId: ArtifactPublicService_GetKnowledgeBase
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetKnowledgeBaseResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the knowledge base to retrieve.

          Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+
      tags:
      - Artifact
      x-stage: alpha
    delete:
      summary: Delete a knowledge base
      description: Deletes a knowledge base.
      operationId: ArtifactPublicService_DeleteKnowledgeBase
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteKnowledgeBaseResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the knowledge base to delete.

          Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+
      tags:
      - Artifact
      x-stage: alpha
    patch:
      summary: Update a chunk
      description: Updates a chunk.
      operationId: ArtifactPublicService_UpdateChunk
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChunkResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name
        description: 'The resource name of the chunk to update.

          Format:

          `namespaces/{namespace}/knowledge-bases/{knowledge_base}/files/{file}/chunks/{chunk}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+/files/[^/]+/chunks/[^/]+
      tags:
      - Artifact
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChunkBody'
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1alpha/{knowledgeBase.name}:
    patch:
      summary: Update a knowledge base info
      description: Updates the information of a knowledge base.
      operationId: ArtifactPublicService_UpdateKnowledgeBase
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateKnowledgeBaseResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: knowledgeBase.name
        description: 'Field 1: Canonical resource name.

          Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`.'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+
      tags:
      - Artifact
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  title: 'Field 2: Immutable canonical resource ID (80-96 bits entropy, base62).

                    Example: "kb-8f3a2k9E7c1"'
                  readOnly: true
                displayName:
                  type: string
                  description: 'Field 3: Human-readable display name for UI.'
                slug:
                  type: string
                  title: 'Field 4: URL-friendly slug (NO prefix).

                    If omitted, server generates from display_name.

                    If provided, server validates and persists it.

                    Slug is NOT part of resource identity.

                    Example: "my-knowledge-base"'
                aliases:
                  type: array
                  items:
                    type: string
                  description: 'Field 5: Previous slugs for backward compatibility.

                    When display_name changes, a new slug is generated and old slugs are stored

                    here.'
                  readOnly: true
                description:
                  type: string
                  description: 'Field 6: Optional description.'
                createTime:
                  type: string
                  format: date-time
                  description: 'Field 7: Creation time.'
                  readOnly: true
                updateTime:
                  type: string
                  format: date-time
                  description: 'Field 8: Last update time.'
                  readOnly: true
                tags:
                  type: array
                  items:
                    type: string
                  description: The knowledge base tags.
                type:
                  description: 'The knowledge base type (persistent or ephemeral).

                    Default is PERSISTENT if not specified during creation.'
                  allOf:
                  - $ref: '#/components/schemas/KnowledgeBaseType'
                system:
                  type: string
                  description: 'The resource name of the system configuration.

                    Format: `systems/{system}`

                    Available systems: "systems/openai", "systems/gemini", or custom systems.

                    If not specified, defaults to the default system.'
                  title: 'System ID defines how the knowledge base will be created based on the

                    system''s RAG configurations including:

                    - AI model family (e.g., "openai", "gemini")

                    - Embedding vector dimensionality

                    - Chunking method

                    - Other RAG-related settings'
                embeddingConfig:
                  description: The embedding configuration for the knowledge base.
                  allOf:
                  - $ref: '#/components/schemas/EmbeddingConfig'
                activeCollection:
                  type: string
                  description: 'The resource name of the active Milvus collection for this knowledge base.

                    Format:

                    `namespaces/{namespace}/knowledge-bases/{knowledge_base}/collections/{collection}`

                    This supports collection versioning for embedding dimension changes.'
                  readOnly: true
                ownerName:
                  type: string
                  title: 'Resource name of the owner namespace.

                    Example: "namespaces/usr-7k2m9p4w1n3" or "namespaces/org-3t8f5q2x6b1"'
                  readOnly: true
                owner:
                  description: Knowledge base owner (User or Organization).
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/Owner'
                creatorName:
                  type: string
                  description: 'Full resource name of the user who created this knowledge base.

                    Format: `users/{user}`

                    Optional for system-created knowledge bases (e.g., instill-agent).'
                  readOnly: true
                creator:
                  description: 'The user who created this knowledge base.

                    Populated when creator_name is present.'
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/v1beta.User'
                totalFiles:
                  type: integer
                  format: int64
                  description: The total files in knowledge base.
                  readOnly: true
                totalTokens:
                  type: integer
                  format: int64
                  description: The total tokens in knowledge base.
                  readOnly: true
                usedStorage:
                  type: string
                  format: uint64
                  description: The current used storage in knowledge base.
                  readOnly: true
                downstreamApps:
                  type: array
                  items:
                    type: string
                  description: The downstream apps.
                  readOnly: true
              title: 'The knowledge base resource to update. The knowledge base''s `name` field

                identifies the resource.

                Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`'
              required:
              - displayName
        description: 'The knowledge base resource to update. The knowledge base''s `name` field

          identifies the resource.

          Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`'
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1alpha/{parent}/files:
    get:
      summary: List files
      description: Returns a paginated list of files.
      operationId: ArtifactPublicService_ListFiles
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFilesResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name (knowledge base).

          Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+
      - name: pageSize
        description: The page size (default:10; max 100).
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageToken
        description: The next page token(default from first file's token).
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: 'Filter can hold an [AIP-160](https://google.aip.dev/160)-compliant filter

          expression.

          - `id="<uuid>"` or `uid="<uuid>"` - Filter by specific file ID/UID

          (supports multiple IDs separated by OR)

          - `process_status="FILE_PROCESS_STATUS_COMPLETED"` - Filter by processing

          status

          - `q="<text>"` - Fuzzy search on file display name, ID, and description


          **Examples**:

          - List specific files: `id="uuid1" OR id="uuid2"`

          - List completed files: `process_status="FILE_PROCESS_STATUS_COMPLETED"`

          - Search files: `q="aws"`'
        in: query
        required: false
        schema:
          type: string
      - name: view
        description: "View allows clients to specify the desired file view in the response.\nWhen set, each returned `File` carries a populated\n`derived_resource_uri` (see `File.derived_resource_uri`), so the list\ncall subsumes the per-file `GetFile(view=…)` fan-out that the Files\npage previously performed. Server-side the resolver fans out presign\nwork across a bounded worker pool; unset leaves `derived_resource_uri`\nempty for every row. `thumbnail_uri` is always populated when a\nthumbnail exists and is unaffected by this flag.\n\n - VIEW_BASIC: Default view, only includes basic metadata.\n - VIEW_FULL: Full representation with all metadata.\n - VIEW_SUMMARY: Returns MinIO pre-signed URL to converted summary content.\n - VIEW_CONTENT: Returns MinIO pre-signed URL to converted markdown content.\n - VIEW_STANDARD_FILE_TYPE: Returns MinIO pre-signed URL to standardized file:\n- Documents → PDF\n- Images → PNG\n- Audio → OGG\n- Video → MP4\n - VIEW_ORIGINAL_FILE_TYPE: Returns MinIO pre-signed URL to the original uploaded file.\n - VIEW_CACHE: Returns Gemini cache resource name.\n - VIEW_PATCH: Returns MinIO pre-signed URL to patch.md (user-submitted content patches)."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
          - VIEW_SUMMARY
          - VIEW_CONTENT
          - VIEW_STANDARD_FILE_TYPE
          - VIEW_ORIGINAL_FILE_TYPE
          - VIEW_CACHE
          - VIEW_PATCH
      tags:
      - Artifact
      x-stage: alpha
    post:
      summary: Create a file
      description: Uploads and converts a file.
      operationId: ArtifactPublicService_CreateFile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFileResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: parent
        description: 'The parent resource name (knowledge base).

          Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+
      tags:
      - Artifact
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/File'
        description: The file to create.
        required: true
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1alpha/{name_1}:
    get:
      summary: Get a file
      description: Returns the details of a file.
      operationId: ArtifactPublicService_GetFile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFileResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_1
        description: 'The resource name of the file to retrieve.

          Format:

          `namespaces/{namespace}/knowledge-bases/{knowledge_base}/files/{file}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+/files/[^/]+
      - name: view
        description: "View allows clients to specify the desired file view in the response.\n\n - VIEW_BASIC: Default view, only includes basic metadata.\n - VIEW_FULL: Full representation with all metadata.\n - VIEW_SUMMARY: Returns MinIO pre-signed URL to converted summary content.\n - VIEW_CONTENT: Returns MinIO pre-signed URL to converted markdown content.\n - VIEW_STANDARD_FILE_TYPE: Returns MinIO pre-signed URL to standardized file:\n- Documents → PDF\n- Images → PNG\n- Audio → OGG\n- Video → MP4\n - VIEW_ORIGINAL_FILE_TYPE: Returns MinIO pre-signed URL to the original uploaded file.\n - VIEW_CACHE: Returns Gemini cache resource name.\n - VIEW_PATCH: Returns MinIO pre-signed URL to patch.md (user-submitted content patches)."
        in: query
        required: false
        schema:
          type: string
          enum:
          - VIEW_BASIC
          - VIEW_FULL
          - VIEW_SUMMARY
          - VIEW_CONTENT
          - VIEW_STANDARD_FILE_TYPE
          - VIEW_ORIGINAL_FILE_TYPE
          - VIEW_CACHE
          - VIEW_PATCH
      - name: storageProvider
        description: "Storage provider specifies which storage backend to use for the file\nresource. This field is only applicable for views that return file content:\nVIEW_SUMMARY, VIEW_CONTENT, VIEW_STANDARD_FILE_TYPE,\nVIEW_ORIGINAL_FILE_TYPE.\n- STORAGE_PROVIDER_UNSPECIFIED or STORAGE_PROVIDER_MINIO: Returns MinIO\npre-signed URL (default)\n- STORAGE_PROVIDER_GCS: Uploads file to GCS if not present (with cache\ncheck), returns GCS signed URL GCS requires proper configuration in system\nsettings.\n\n - STORAGE_PROVIDER_MINIO: Use MinIO as the storage backend (default)\n - STORAGE_PROVIDER_GCS: Use Google Cloud Storage as the storage backend"
        in: query
        required: false
        schema:
          type: string
          enum:
          - STORAGE_PROVIDER_MINIO
          - STORAGE_PROVIDER_GCS
      tags:
      - Artifact
      x-stage: alpha
    delete:
      summary: Delete a file
      description: Deletes a file.
      operationId: ArtifactPublicService_DeleteFile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFileResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: name_1
        description: 'The resource name of the file to delete.

          Format:

          `namespaces/{namespace}/knowledge-bases/{knowledge_base}/files/{file}`'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+/files/[^/]+
      tags:
      - Artifact
      x-stage: alpha
    servers:
    - url: https://api.instill-ai.com
    - url: http://api.instill-ai.com
  /v1alpha/{file.name}:
    patch:
      summary: Update a file
      description: Updates a file.
      operationId: ArtifactPublicService_UpdateFile
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFileResponse'
        '401':
          description: Returned when the client credentials are not valid.
          content:
            application/json:
              schema: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'
      parameters:
      - name: file.name
        description: 'Field 1: Canonical resource name.

          Format:

          `namespaces/{namespace}/knowledge-bases/{knowledge_base}/files/{file}`.'
        in: path
        required: true
        schema:
          type: string
          pattern: namespaces/[^/]+/knowledge-bases/[^/]+/files/[^/]+
      tags:
      - Artifact
      x-stage: alpha
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  title: 'Field 2: Immutable canonical resource ID (80-96 bits entropy, base62).

                    Example: "file-8f3a2k9E7c1"'
                  readOnly: true
                displayName:
                  type: string
                  description: 'Field 3: Human-readable display name (filename) for UI.

                    This is typically the original filename of the uploaded file.'
                slug:
                  type: string
                  title: 'Field 4: URL-friendly slug (NO prefix).

                    If omitted, server generates from display_name.

                    If provided, server validates and persists it.

                    Slug is NOT part of resource identity.

                    Example: "my-research-file-pdf"'
                aliases:
                  type: array
                  items:
                    type: string
                  description: 'Field 5: Previous slugs for backward compatibility.

                    When display_name changes, a new slug is generated and old slugs are stored

                    here.'
                  readOnly: true
                description:
                  type: string
                  description: 'Field 6: Optional description.'
                createTime:
                  type: string
                  format: date-time
                  description: 'Field 7: Creation time.'
                  readOnly: true
                updateTime:
                  type: string
                  format: date-time
                  description: 'Field 8: Last update time.'
                  readOnly: true
                type:
                  description: File type.
                  allOf:
                  - $ref: '#/components/schemas/File.Type'
                processStatus:
                  description: File process status.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/FileProcessStatus'
                processOutcome:
                  type: string
                  description: File process outcome message.
                  readOnly: true
                size:
                  type: string
                  format: int64
                  description: File size in bytes.
                  readOnly: true
                totalChunks:
                  type: integer
                  format: int32
                  description: Total number of chunks created from this file.
                  readOnly: true
                totalTokens:
                  type: integer
                  format: int32
                  description: Total number of tokens in this file.
                  readOnly: true
                tags:
                  type: array
                  items:
                    type: string
                  description: Array of tags associated with the file.
                externalMetadata:
                  type: object
                  description: Custom metadata provided by the user during file upload.
                knowledgeBases:
                  type: array
                  items:
                    type: string
                  description: 'Knowledge base resource names that this file is associated with.

                    Format: `namespaces/{namespace}/knowledge-bases/{knowledge_base}`

                    A file can belong to multiple knowledge bases within the same namespace.

                    This field is populated from the file_knowledge_base junction table.

                    Follows AIP-122 for resource name references.'
                  readOnly: true
                ownerName:
                  type: string
                  title: 'Resource name of the owner namespace.

                    Example: "namespaces/usr-7k2m9p4w1n3" or "namespaces/org-3t8f5q2x6b1"'
                  readOnly: true
                creatorName:
                  type: string
                  title: 'Full resource name of the user who created this file.

                    Format: `users/{user}`'
                  readOnly: true
                content:
                  type: string
                  description: 'Base64-encoded file content for inline upload.

                    Alternative to object field for smaller files.'
                downloadUrl:
                  type: string
                  description: Pre-signed download URL for the file.
                  readOnly: true
                convertingPipeline:
                  type: string
                  description: 'Pipeline used for converting the file to Markdown if the file is a

                    document (i.e., a file with pdf, doc[x] or ppt[x] extension).'
                length:
                  description: Length of the file in the specified unit type.
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/Position'
                collections:
                  type: array
                  items:
                    type: string
                  description: 'Collection resource names that this file belongs to.

                    Format: `namespaces/{namespace}/collections/{collection}`

                    This field is system-managed and populated from collection membership.

                    Follows AIP-122 for resource name references.'
                  readOnly: true
                deleteTime:
                  type: string
                  format: date-time
                  description: Soft delete timestamp.
                  readOnly: true
                object:
                  type: string
                  description: "Object resource name reference for blob storage upload.\nFormat: `namespaces/{namespace}/objects/{object}`\nTwo upload approaches are supported:\n1. Direct upload: Upload file directly to MinIO via GetObjectUploadURL,\n   then provide the object resource name here.\n   This avoids base64 encoding overhead and is preferred for large files.\n2. Inline content: Provide base64-encoded file content in the 'content'\n   field. When object is provided, the 'content' field is ignored.\nFollows AIP-122 for resource name references."
                isTextBased:
                  type: boolean
                  description: 'Whether the document contains a native text layer (true) or is

                    image-based / scanned (false). Determined during file processing by

                    attempting PDF text extraction. Used for visual grounding: text-based

                    documents get precise text highlighting while image-based documents

                    get bounding-box overlays.

                    Only meaningful for document file types (PDF, DOCX, PPTX, etc.).'
                  readOnly: true
                contentSha256:
                  type: string
                  description: 'SHA256 hash of the file content for content-based deduplication.

                    Computed at ingestion time for both inline content uploads and object

                    reference uploads.'
                  readOnly: true
                ownerDisplayName:
                  type: string
                  description: 'Human-readable display name of the owner namespace.

                    Populated server-side to avoid an extra frontend API call.

                    Example: "Instill AI" (for an org) or "John Doe" (for a user).'
                  readOnly: true
                ownerAvatar:
                  type: string
                  description: 'Avatar URL of the owner namespace.

                    Populated server-side alongside owner_display_name.'
                  readOnly: true
                creatorDisplayName:
                  type: string
                  description: 'Human-readable display name of the user who created this file.

                    Populated server-side to avoid an extra frontend API call.'
                  readOnly: true
                creatorAvatar:
                  type: string
                  description: 'Avatar URL of the user who created this file.

                    Populated server-side alongside creator_display_name.'
                  readOnly: true
                visibility:
                  description: Visibility of the file.
                  allOf:
                  - $ref: '#/components/schemas/File.Visibility'
                derivedResourceUri:
                  type: string
                  description: 'Derived resource URI populated on `ListFiles` / `GetFile` responses when

                    the caller requested an explicit `File.View` (SUMMARY, CONTENT,

                    STANDARD_FILE_TYPE, ORIGINAL_FILE_TYPE, CACHE, PATCH). Mirrors the

                    long-standing `GetFileResponse.derived_resource_uri` slot so

                    list-shaped responses can carry per-row URIs without an extra per-file

                    `GetFile` round trip. Empty when no view was requested. Subject to the

                    short-lived MinIO/GCS presign TTL — treat as ephemeral and do not

                    cross-cache.'
                  readOnly: true
                thumbnailUri:
                  type: string
                  description: 'Stable, cache-friendly URL to a small (~1024px WebP) thumbnail of the

                    file, populated whenever a `CONVERTED_FILE_TYPE_THUMBNAIL` row exists

                    for this file. Resolved through the gateway''s

                    `/v1alpha/blob-urls/{object_uid}` route so the URL itself is stable

                    across presign rotations and CDN-cacheable. Empty for files whose

                    thumbnail has not yet been generated (backfill workflow covers

                    historical rows; ingest covers new ones). Clients should treat this as

                    the preferred card-tile source and fall back to `derived_resource_uri`

                    / mime-type icon when absent.'
                  readOnly: true
                parentFolder:
                  type: string
                  description: 'The folder that this file belongs to (single parent).

                    File permissions cascade from this folder — the file inherits

                    viewer/editor/commenter/resource_owner from its parent folder.

                    Format: `namespaces/{namespace}/folders/{folder}`

                    Populated server-side from the file''s parent_folder_uid DB column.

                    Files without an explicit parent folder default to the namespace''s

                    root folder ("Workspace").'
                  readOnly: true
              title: 'The file resource to update. The file''s `name` field identifies the

                resource. Format:

                `namespaces/{namespace}/knowledge-bases/{knowledge_base}/files/{file}`'
              required:
              - displayName
        description: 'The file resource to update. The file''s `name` field identifies the

          resource. Format:

          `namespaces/{namespace}/knowledge-bases/{knowledge_base}/files/{file}`'
        required: true
