name: Instill Core Developer Platform (docs MCP server)
description: ReadMe-hosted MCP server attached to the Instill Core developer docs (docs.instill-ai.com).
  It exposes the published API reference (list/search/get endpoint) plus a generic execute-request tool
  that sends a HAR request to the Instill Core API. It is a docs/API-reference server, not a purpose-built
  product tool server. Its docs pages (https://instill-ai.readme.io/docs/mcp.md and the changelog entry
  "MCP is now live for Instill Core docs!") are listed in llms.txt, but on 2026-10-09 they returned 404
  or a 429 anti-bot page.
