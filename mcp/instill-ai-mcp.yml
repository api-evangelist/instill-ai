tools:
- name: list-endpoints
  description: Lists all API paths and their HTTP methods with summaries, organized by path. Results can
    be passed directly into 'get-endpoint'.
  title: List API Endpoints
  inputSchema:
    type: object
    $schema: https://json-schema.org/draft/2020-12/schema
    properties: {}
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
- name: get-endpoint
  description: Gets detailed information about a specific API endpoint, including security schemes and
    servers
  title: Get Endpoint Details
  inputSchema:
    type: object
    $schema: https://json-schema.org/draft/2020-12/schema
    properties:
      path:
        type: string
        description: The API endpoint path (e.g. /api/v1/users).
      method:
        type: string
        description: The HTTP method (e.g. GET, POST, PUT, DELETE).
    required:
    - path
    - method
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
- name: search-endpoints
  description: Performs a deep search through paths, operations, and parameters to discover relevant API
    endpoints. Use this tool to find specific API capabilities, required parameters, or data models based
    on search keywords. Results can be passed directly into 'get-endpoint'.
  title: Search API Endpoints
  inputSchema:
    type: object
    $schema: https://json-schema.org/draft/2020-12/schema
    properties:
      pattern:
        type: string
        description: Search pattern (case-insensitive)
    required:
    - pattern
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
- name: execute-request
  description: Executes an API request with a given HAR request object.
  title: Execute API Request
  inputSchema:
    type: object
    $schema: https://json-schema.org/draft/2020-12/schema
    properties:
      harRequest:
        type: object
        properties:
          method:
            type: string
            description: options, get, head, patch, post, put, delete
          url:
            type: string
            format: uri
            description: full url to call
          headers:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                value:
                  type: string
              required:
              - name
              - value
          postData:
            anyOf:
            - type: object
              properties:
                mimeType:
                  type: string
                  description: e.g. application/json, text/plain
                text:
                  type: string
                  description: Raw request body as a string
              required:
              - mimeType
              - text
            - type: object
              properties:
                mimeType:
                  type: string
                  description: e.g. multipart/form-data, application/x-www-form-urlencoded. Use multipart/form-data
                    for form submissions.
                params:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                    required:
                    - name
                  description: Form parameters. Use this instead of text for multipart/form-data and url-encoded
                    requests.
              required:
              - mimeType
              - params
          queryString:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                value:
                  type: string
              required:
              - name
              - value
        required:
        - method
        - url
        description: HAR request object
    required:
    - harRequest
  annotations:
    readOnlyHint: false
    destructiveHint: true
    openWorldHint: true
- name: get-server-variables
  description: Gets the server variables for each server within a specific OpenAPI spec.
  title: Get Server Variables
  inputSchema:
    type: object
    $schema: https://json-schema.org/draft/2020-12/schema
    properties: {}
  annotations:
    readOnlyHint: true
    destructiveHint: false
    openWorldHint: false
notes:
- execute-request calls the Instill Core API (host api.instill-ai.com per the OpenAPI); those calls need
  a Bearer API key (instill_sk_***) even though the MCP endpoint itself is open.
